# Build and cache the Lean toolchain, run the flake checks, and build the
# templates against this checkout
name: Nix CI

on:
  push:
    branches: dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and cache lean4-nix
    runs-on: runs-on=${{ github.run_id }}-check-${{ github.run_attempt }}/cpu=16/family=r7i+r8i+r7a+r8a/image=ubuntu26-full-x64/volume=150gb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ github.token }}
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: argumentcomputer
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      # Builds every derivation in `checks.nix`: the toolchain itself, the
      # lake2nix template builds and their Lake dependencies, and the VM test.
      - run: nix flake check --print-build-logs

  test:
    name: Test templates
    needs: check
    strategy:
      matrix:
        template: [minimal, dependency, incremental]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ github.token }}
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: argumentcomputer
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skipPush: true
      # Build the template the way a consumer would, but against this checkout
      # rather than the published flake.
      - name: Use the local lean4-nix
        run: |
          sed -i 's|lean4-nix.url = "github:[^"]*"|lean4-nix.url = "path:../.."|' flake.nix
          grep lean4-nix.url flake.nix
        working-directory: ${{ github.workspace }}/templates/${{ matrix.template }}
      - run: nix build --print-build-logs
        working-directory: ${{ github.workspace }}/templates/${{ matrix.template }}
      # `incremental` also exposes a test executable built from the library's
      # reused artifacts.
      - if: matrix.template == 'incremental'
        run: nix build --print-build-logs .#test
        working-directory: ${{ github.workspace }}/templates/${{ matrix.template }}

  lints:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint, shellcheck over composite action scripts, pinact (actions
      # must be SHA-pinned with a matching version comment) and zizmor
      - uses: argumentcomputer/ci-workflows/.github/actions/lint-workflows@main
