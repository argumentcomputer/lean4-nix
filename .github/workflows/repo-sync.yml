# Pull upstream changes from lenianiva/lean4-nix daily at midnight
name: Repo sync

on:
  schedule:
    - cron: "0 0 * * *"
      timezone: America/New_York
  workflow_dispatch:

permissions: {}

jobs:
  repo-sync:
    name: Sync upstream changes
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: argumentcomputer/ci-workflows/.github/actions/repo-sync@main
        with:
          repository: lenianiva/lean4-nix
          # This fork's default branch is `dev`; `main` is kept as a plain mirror
          # of upstream, so both sides of the sync share the branch name.
          branch: main
